<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
    </style>
  </head>
  <body>
    <div class="container">
      Room:
      <span id="current-room">None</span>
    </div>

    <div>
      <input id="room-input" placeholder="Room ID" type="text"/>
      <button id="create">Create Room</button>
      <button id="join">Join Room</button>
      <button id="leave">Leave Room</button>
    </div>

    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Send</button>
    </form>
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script>
    <script>
      var socket = io();

      var form = document.getElementById('form');
      var input = document.getElementById('input');
      var messages = document.getElementById('messages');

      var roomInput = document.getElementById('room-input');
      var currentRoomText = document.getElementById('current-room');
      let currentRoom = null;

      document.getElementById('create').onclick = () => {
        currentRoom = roomInput.value;
        currentRoomText.textContent = currentRoom;
        socket.emit('create_grp', currentRoom);
      };

      document.getElementById('join').onclick = () => {
        currentRoom = roomInput.value;
        currentRoomText.textContent = currentRoom;
        socket.emit('join_room', currentRoom);
      };

      document.getElementById('leave').onclick = () => {
        currentRoom = null;
        currentRoomText.textContent = 'None';
        socket.emit('leave_room', currentRoom);
      };

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (input.value) {
          addMessage('You: ' + input.value);
          socket.emit('grp_message', {roomId: currentRoom, message: input.value});
          input.value = '';
        }
      });

      socket.on('serv_grp_message', function(msg) {
        addMessage(msg);
      });

      socket.on('room_joined', (roomId) => {
        currentRoom = roomId;
        currentRoomText.textContent = currentRoom;
      });

      function addMessage(text) {
        var item = document.createElement('li');
        item.textContent = text;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      }


    </script>
  </body>
</html>
